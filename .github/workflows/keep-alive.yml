name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: curl -fsS --max-time 120 https://alfa-plataforma.onrender.com/api/health

      - name: Heartbeat (mantiene activa la agenda tras 60 dias sin actividad)
        run: |
          set -e
          REPO="${{ github.repository }}"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          API="https://api.github.com/repos/$REPO"
          AUTH=(-H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json")
          LAST=$(curl -s "${AUTH[@]}" "$API/commits?per_page=1" | jq -r '.[0].commit.committer.date // "1970-01-01T00:00:00Z"')
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
          echo "ultimo commit hace ${AGE} dias"
          if [ "$AGE" -ge 30 ]; then
            printf '%s\n' "$(date -u +%FT%TZ)" > heartbeat.txt
            CONTENT=$(base64 -w0 heartbeat.txt)
            SHA=$(curl -s "${AUTH[@]}" "$API/contents/heartbeat.txt" | jq -r '.sha // empty')
            EXTRA=""
            if [ -n "$SHA" ]; then EXTRA=",\"sha\":\"$SHA\""; fi
            curl -fsS -X PUT "${AUTH[@]}" "$API/contents/heartbeat.txt" \
              -d "{\"message\":\"heartbeat\",\"content\":\"$CONTENT\"$EXTRA}" > /dev/null
            echo "heartbeat enviado"
          fi